# Application
spring.application.name=linkflow
server.port=${SERVER_PORT:8080}

# Database (configure via environment variables; do not commit real credentials)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# LinkFlow settings
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.short-code.length=${APP_SHORT_CODE_LENGTH:6}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
